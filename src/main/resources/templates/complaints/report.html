<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Report Maintenance Issue')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow rounded-4 overflow-hidden bg-white">
                <div class="p-4 bg-danger text-white">
                    <h3 class="fw-bold mb-1"><i class="bi bi-tools me-2"></i> Report Campus Maintenance Issue</h3>
                    <p class="small text-white-50 mb-0">Submit a ticket for equipment repair, network outages, cleanliness, or facility maintenance</p>
                </div>

                <div class="p-4 p-md-5">
                    <form th:action="@{/complaints/report}" th:object="${complaint}" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="title" class="form-label fw-semibold">Issue Title / Subject *</label>
                                <input type="text" th:field="*{title}" id="title" class="form-control" placeholder="e.g. Wi-Fi router signal down in Library 3rd Floor" required>
                            </div>

                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Problem Category *</label>
                                <select th:field="*{category}" id="category" class="form-select" required>
                                    <option value="WIFI_NETWORK">Wi-Fi & Internet Connectivity</option>
                                    <option value="ELECTRICAL">Electrical & AC / Fans</option>
                                    <option value="CLEANLINESS">Cleanliness & Restroom Hygiene</option>
                                    <option value="FURNITURE">Classroom Benches & Desks</option>
                                    <option value="LAB_EQUIPMENT">Lab Computers & Instruments</option>
                                    <option value="PLUMBING">Plumbing & Water Purifier</option>
                                    <option value="OTHER">Other Campus Maintenance</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="priority" class="form-label fw-semibold">Priority Level *</label>
                                <select th:field="*{priority}" id="priority" class="form-select" required>
                                    <option value="LOW">Low (Minor inconvenience)</option>
                                    <option value="MEDIUM" selected>Medium (Standard request)</option>
                                    <option value="HIGH">High (Affects classes / labs)</option>
                                    <option value="URGENT">Urgent (Safety hazard or complete outage)</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="location" class="form-label fw-semibold">Exact Location on Campus *</label>
                                <input type="text" th:field="*{location}" id="location" class="form-control" placeholder="e.g. Turing Complex Lab 204, Aryabhatta Ground Floor Restroom" required>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Detailed Description of the Issue *</label>
                                <textarea th:field="*{description}" id="description" rows="5" class="form-control" placeholder="Describe the fault, symptoms, equipment tag numbers, or when the problem started..." required></textarea>
                            </div>

                            <div class="col-12 mt-4 text-end">
                                <a th:href="@{/complaints}" class="btn btn-outline-secondary me-2">Cancel</a>
                                <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                    <i class="bi bi-send me-1"></i> Submit Maintenance Ticket
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
