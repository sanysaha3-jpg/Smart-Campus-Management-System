<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('User Profile')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow rounded-4 overflow-hidden">
                <div class="p-4 bg-primary text-white d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold fs-2" style="width: 64px; height: 64px;">
                            <span th:text="${user.fullName.substring(0, 1)}">U</span>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${user.fullName}">User Full Name</h4>
                            <div class="small opacity-75">
                                <span class="badge bg-warning text-dark me-2" th:text="${user.role}">STUDENT</span>
                                <span th:text="'@' + ${user.username}">@username</span>
                            </div>
                        </div>
                    </div>
                    <span class="badge bg-success-subtle text-success border px-3 py-2">
                        <i class="bi bi-shield-check me-1"></i> Account Active
                    </span>
                </div>

                <div class="p-4 p-md-5 bg-white">
                    <h5 class="fw-bold text-primary mb-4 pb-2 border-bottom">Edit Profile Information</h5>
                    <form th:action="@{/profile}" th:object="${user}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" th:field="*{username}" class="form-control bg-light" readonly>
                                <small class="text-muted">Username cannot be changed</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Role</label>
                                <input type="text" th:value="${user.role}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-12">
                                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                <input type="text" th:field="*{fullName}" id="fullName" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" th:field="*{email}" id="email" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" th:field="*{phone}" id="phone" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label for="studentOrFacultyId" class="form-label fw-semibold">Student / Faculty ID</label>
                                <input type="text" th:field="*{studentOrFacultyId}" id="studentOrFacultyId" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label for="department" class="form-label fw-semibold">Department</label>
                                <input type="text" th:field="*{department}" id="department" class="form-control">
                            </div>

                            <div class="col-12">
                                <label for="password" class="form-label fw-semibold">New Password (leave empty to keep current)</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••">
                            </div>

                            <div class="col-12 mt-4 text-end">
                                <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                                    <i class="bi bi-save me-1"></i> Save Changes
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
