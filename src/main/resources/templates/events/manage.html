<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Events')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container-fluid px-lg-5 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-primary mb-1"><i class="bi bi-calendar-check-fill text-warning me-2"></i> Event Management Portal</h3>
            <p class="text-muted small mb-0">Oversee registrations, update event logistics, and download attendee rosters.</p>
        </div>
        <a th:href="@{/events/create}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle me-1"></i> Create New Event
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date & Time</th>
                        <th>Venue</th>
                        <th>Organizer</th>
                        <th>Enrolled / Cap</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${events.isEmpty()}">
                        <td colspan="8" class="text-center py-4 text-muted">No events found.</td>
                    </tr>
                    <tr th:each="e : ${events}">
                        <td>
                            <strong th:text="${e.title}">Title</strong>
                            <div class="small text-muted" th:text="${e.department}">Dept</div>
                        </td>
                        <td><span class="badge bg-secondary" th:text="${e.category}">CATEGORY</span></td>
                        <td class="small">
                            <div th:text="${e.eventDate}">2026-11-20</div>
                            <div class="text-muted" th:text="${e.startTime} + ' - ' + ${e.endTime}">09:00 - 17:00</div>
                        </td>
                        <td class="small" th:text="${e.venue}">Venue</td>
                        <td class="small" th:text="${e.organizer != null ? e.organizer.fullName : 'Admin'}">Organizer</td>
                        <td>
                            <span class="badge bg-info-subtle text-info fs-6">
                                <span th:text="${e.currentParticipants}">0</span> / <span th:text="${e.maxParticipants}">100</span>
                            </span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${e.status == 'UPCOMING' ? 'bg-success' : 'bg-danger'}" th:text="${e.status}">UPCOMING</span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/events/view/' + ${e.id}}" class="btn btn-outline-secondary" title="View attendees roster"><i class="bi bi-people"></i></a>
                                <a th:href="@{'/events/edit/' + ${e.id}}" class="btn btn-outline-primary" title="Edit event"><i class="bi bi-pencil"></i></a>
                                <form th:if="${e.status == 'UPCOMING'}" th:action="@{'/events/cancel/' + ${e.id}}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Cancel this event?')" title="Cancel event"><i class="bi bi-x-circle"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
